{% extends 'base.html' %}
{% block title %}Đổi mật khẩu · Smart Lock{% endblock %}
{% block body %}
<main class="card form-card">
  <div>
    <p class="eyebrow">Tài khoản</p>
    <h1>Đổi mật khẩu</h1>
    <p class="muted">{{ username }}</p>
  </div>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  {% if success %}<p class="notice">{{ success }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field">Mật khẩu hiện tại<input name="current_password" type="password" autocomplete="current-password" required></label>
    <label class="field">Mật khẩu mới<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label class="field">Xác nhận mật khẩu mới<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="button" type="submit">Cập nhật mật khẩu</button>
  </form>
</main>
{% endblock %}
