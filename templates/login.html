{% extends 'base.html' %}
{% block title %}Đăng nhập · SECURESCAN AI{% endblock %}
{% block head %}<style>
  body { display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 50% 20%,#e5efff 0,transparent 38%),#f8fafc; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.45; background-image:radial-gradient(#d5deeb 1px,transparent 1px); background-size:28px 28px; }
  .login { position:relative; width:min(100%,440px); padding:40px 32px; } .login-head { text-align:center; margin-bottom:32px; } .mark { width:64px; height:64px; display:grid; place-items:center; margin:auto auto 18px; color:var(--blue); background:#e7f0ff; border:1px solid #bfdbfe; border-radius:50%; } .mark .icon { font-size:38px; }
  .login h1 { margin:0; font-size:28px; letter-spacing:-1px; } .login p { color:#64748b; margin:9px 0 0; } .login form { display:grid; gap:18px; } .input-icon { position:relative; } .input-icon .icon { position:absolute; left:13px; top:13px; color:#64748b; } .input-icon input { padding-left:43px; width:100%; }
  .password-toggle { position:absolute; right:8px; top:6px; color:#64748b; background:none; border:0; padding:6px; } .footer { text-align:center; color:#94a3b8; margin-top:22px; font-size:11px; letter-spacing:.08em; }
</style>{% endblock %}
{% block body %}<main class="card login"><header class="login-head"><div class="mark"><span class="icon">shield</span></div><h1>SECURESCAN AI</h1><p>Hệ thống nhận diện an toàn</p></header>{% if error %}<p class="notice error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field">Operator ID<div class="input-icon"><span class="icon">badge</span><input name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required autofocus></div></label><label class="field">Access Code<div class="input-icon"><span class="icon">lock</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" onclick="password.type=password.type==='password'?'text':'password'"><span class="icon">visibility</span></button></div></label><button class="button" type="submit"><span class="icon">login</span>ĐĂNG NHẬP</button></form><div class="footer">KẾT NỐI BẢO MẬT · SMART LOCK</div></main>{% endblock %}
